<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Crew Rates</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            background-color: #f8f9fa;
        }

        .form-accounts {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .notice {
            margin-top: 2rem;
            text-align: left;
        }

        .notice p:last-child {
            margin-bottom: 0;
        }

        footer {
            position: sticky;
            bottom: 0;
            width: 100%;
            height: 30px;
            line-height: 30px;
            background-color: #f8f9fa;
            padding-left: 10px;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="flex-grow-1 d-flex align-items-center">
        <div class="form-accounts">

            <div class="text-center">
                <img src="cr_square_logo.svg"
                     width="100"
                     class="mb-3"
                     alt="Crew Rates logo">
            </div>

            <div class="text-center mb-4">
                <img src="cr_text_logo.svg"
                     width="200"
                     class="mt-3"
                     alt="Crew Rates">
            </div>
	    <br>
	    <br>
	    <br>
            <div class="notice">

                <p>
                    Thank you to everyone who contributed rate information
                    and helped build Crew Rates. The service has been permanently retired.
                </p>

                <p>
                    We appreciate the support of the unscripted community
                    over the years and are grateful to everyone who
                    participated.
                </p>
            </div>

        </div>
    </main>

    <footer class="text-start">
        <small>
            © <span id="current-year"></span> crewrates.org
        </small>
    </footer>

    <script>
        document.getElementById('current-year').textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
